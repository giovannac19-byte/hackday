<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hello, World</title>
  <meta name="description" content="A sleek, softly feminine Hello World page.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%23c2577a' d='M6 0 L7.4 4.6 L12 6 L7.4 7.4 L6 12 L4.6 7.4 L0 6 L4.6 4.6 Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@300;400;500&display=swap">
  <style>
    /* Layout: one quiet centered card over a slow pastel lava-lamp field; serif italic carries the voice. */
    :root {
      --bg: #fbf5f6;
      --blob-rose: #f3b3c6;
      --blob-peach: #f9cfb6;
      --blob-lilac: #d8c3f0;
      --blob-pink: #f6c4de;
      --blob-blush: #fbd9dd;
      --card: rgba(255, 255, 255, 0.58);
      --card-edge: rgba(201, 140, 160, 0.28);
      --ink: #3a2530;
      --ink-soft: #8a6c78;
      --rose: #c2577a;
      --font-display: "Instrument Serif", "Didot", "Bodoni 72", Georgia, serif;
      --font-body: "Figtree", "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1218;
        --blob-rose: #7a2e4c;
        --blob-peach: #7a3d3a;
        --blob-lilac: #4b2f6e;
        --blob-pink: #6d2d5e;
        --blob-blush: #5a2a3c;
        --card: rgba(40, 26, 34, 0.5);
        --card-edge: rgba(232, 160, 186, 0.22);
        --ink: #f7e8ee;
        --ink-soft: #c4a3b1;
        --rose: #ee9ab6;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 300;
      display: grid;
      place-items: center;
      padding-block: 32px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      overflow: hidden;
      position: relative;
    }

    /* Lava lamp: soft blobs that wander, swell and change shape, blurred together */
    .lava {
      position: fixed;
      inset: -10vmax;
      z-index: 0;
      pointer-events: none;
      filter: blur(60px) saturate(1.15);
      animation: lamp-turn 90s linear infinite;
    }
    .blob {
      position: absolute;
      opacity: 0.85;
      border-radius: 42% 58% 63% 37% / 45% 40% 60% 55%;
      will-change: transform, border-radius;
    }
    .blob.b1 {
      width: 52vmax; height: 52vmax;
      top: 0; left: 0;
      background: var(--blob-rose);
      animation: wander-a 26s ease-in-out infinite, morph 14s ease-in-out infinite;
    }
    .blob.b2 {
      width: 46vmax; height: 46vmax;
      bottom: 0; right: 0;
      background: var(--blob-lilac);
      animation: wander-b 32s ease-in-out infinite, morph 17s ease-in-out infinite reverse;
    }
    .blob.b3 {
      width: 38vmax; height: 38vmax;
      top: 30%; right: 8%;
      background: var(--blob-peach);
      animation: wander-c 29s ease-in-out infinite, morph 12s ease-in-out infinite;
    }
    .blob.b4 {
      width: 34vmax; height: 34vmax;
      bottom: 6%; left: 12%;
      background: var(--blob-pink);
      animation: wander-d 36s ease-in-out infinite, morph 19s ease-in-out infinite reverse;
    }
    .blob.b5 {
      width: 28vmax; height: 28vmax;
      top: 38%; left: 38%;
      background: var(--blob-blush);
      animation: wander-e 22s ease-in-out infinite, morph 11s ease-in-out infinite;
    }

    @keyframes morph {
      0%, 100% { border-radius: 42% 58% 63% 37% / 45% 40% 60% 55%; }
      25%      { border-radius: 63% 37% 41% 59% / 58% 62% 38% 42%; }
      50%      { border-radius: 36% 64% 52% 48% / 38% 55% 45% 62%; }
      75%      { border-radius: 55% 45% 34% 66% / 62% 36% 64% 38%; }
    }
    @keyframes wander-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(28vmax, 18vmax) scale(1.12); }
      66%      { transform: translate(8vmax, 34vmax) scale(0.92); }
    }
    @keyframes wander-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      30%      { transform: translate(-30vmax, -14vmax) scale(0.9); }
      65%      { transform: translate(-12vmax, -32vmax) scale(1.15); }
    }
    @keyframes wander-c {
      0%, 100% { transform: translate(0, 0) scale(1); }
      40%      { transform: translate(-26vmax, 20vmax) scale(1.18); }
      70%      { transform: translate(-8vmax, -16vmax) scale(0.88); }
    }
    @keyframes wander-d {
      0%, 100% { transform: translate(0, 0) scale(1); }
      35%      { transform: translate(24vmax, -26vmax) scale(1.1); }
      70%      { transform: translate(34vmax, 4vmax) scale(0.94); }
    }
    @keyframes wander-e {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25%      { transform: translate(-18vmax, -20vmax) scale(1.25); }
      50%      { transform: translate(14vmax, -8vmax) scale(0.85); }
      75%      { transform: translate(6vmax, 18vmax) scale(1.1); }
    }
    @keyframes lamp-turn {
      to { transform: rotate(360deg); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      padding: clamp(40px, 8vw, 72px) clamp(24px, 6vw, 64px);
      background: var(--card);
      border: 1px solid var(--card-edge);
      border-radius: 28px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(3.4rem, 13vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    h1 em {
      font-style: italic;
      color: var(--rose);
    }

    .flourish {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--rose);
    }
    .flourish span {
      display: block;
      width: 44px;
      height: 1px;
      background: currentColor;
      opacity: 0.5;
    }
    .flourish svg { width: 12px; height: 12px; fill: currentColor; }

    p.note {
      margin: 0;
      max-width: 32ch;
      font-size: 1.02rem;
      line-height: 1.65;
      color: var(--ink-soft);
    }

    .load { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .load.d2 { animation-delay: .12s; }
    .load.d3 { animation-delay: .24s; }
    .load.d4 { animation-delay: .36s; }
    @keyframes rise {
      from { transform: translateY(10px); opacity: .001; }
      to   { transform: none; opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lava, .blob, .load { animation: none; }
    }
  </style>
</head>
<body>
  <div class="lava" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="blob b5"></div>
  </div>

  <main class="card">
    <p class="eyebrow load">A first hello</p>
    <h1 class="load d2"><em>Hello,</em> World</h1>
    <div class="flourish load d3" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 12 12"><path d="M6 0 L7.4 4.6 L12 6 L7.4 7.4 L6 12 L4.6 7.4 L0 6 L4.6 4.6 Z"/></svg>
      <span></span>
    </div>
    <p class="note load d4">Every story starts with a single line. This is ours.</p>
  </main>
</body>
</html>
